---
layout: default
title: Tags
permalink: /tags/
---
{% assign tags = site.tags | sort %}
{% for tag in tags %}
<section class="tag-group" id="{{ tag[0] | slugify }}">
	<h2>{{ tag[0] }}</h2>
	<ul class="posts">
		{% for post in tag[1] %}
		<li>
			<a href="{{ post.url | relative_url }}">
				<span class="title">{{ post.title }}</span>
				<span class="meta">{{ post.date | date: "%-d %b %Y" }}</span>
			</a>
		</li>
		{% endfor %}
	</ul>
</section>
{% endfor %}
