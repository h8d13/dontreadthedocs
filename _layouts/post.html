---
layout: default
---
<article>
	<h1>{{ page.title }}</h1>
	<p class="meta">{{ page.date | date: "%-d %b %Y" }}{% include tags.html tags=page.tags link=true %}</p>
	{% if page.description %}<p class="lead">{% include inline.html text=page.description %}</p>{% endif %}
	{% include toc.html html=content %}
	<div class="prose">
		{{ content }}
	</div>
</article>
