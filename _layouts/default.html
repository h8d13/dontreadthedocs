<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
	<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
	{%- comment -%} inlined: pages caps max-age at 600, a stale render-blocking
	sheet held each navigation for a revalidation round trip {%- endcomment %}
	<style>
{% include style.css %}
	</style>
</head>
<body>
	<header>
		<a href="{{ '/' | relative_url }}">{{ site.title }}</a>
	</header>
	<main>
		{{ content }}
	</main>
</body>
</html>
